services:
  xen-orchestra:
    image: ronivay/xen-orchestra:5.200.1@sha256:46692f8ac57a9fbbd6386444adbd3f3bf2946234365f8afed958a932bced3de7
    container_name: xen-orchestra
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.xen-orchestra.rule=Host(`${ASSIGNED_HOSTNAME}`)"
      - "traefik.http.routers.xen-orchestra.entrypoints=websecure"
      - "traefik.http.routers.xen-orchestra.tls.certresolver=cloudflare"
      - "traefik.http.services.xen-orchestra.loadbalancer.server.port=80"
    networks:
      - traefik_network
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 3500M
        reservations:
          cpus: '0.4'
          memory: 200M
    volumes:
      # Config Volume
      - /mnt/data/Apps/xen-orchestra/config:/var/lib/xo-server
      # Backups Volume
      - /mnt/data/Apps/xen-orchestra/backups:/mnt/backups

networks:
  traefik_network:
    external: true
