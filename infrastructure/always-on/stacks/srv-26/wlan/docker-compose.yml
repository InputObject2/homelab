version: '3.8'

services:
  omada-controller:
    image: mbentley/omada-controller:6.3.0.45-openj9@sha256:83160b9b9eadb3e5acd57ca34c65d98f4060e276b865c90f3b73d7f309fc1a8e
    container_name: omada
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
      - "8043:8043/tcp"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
    volumes:
      - omada_data:/opt/tplink/EAPController/data
    env_file:
      - /opt/secrets/omada/omada.env

volumes:
  omada_data:
