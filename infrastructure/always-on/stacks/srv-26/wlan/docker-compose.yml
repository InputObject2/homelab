version: '3.8'

services:
  omada-controller:
    image: mbentley/omada-controller:6.3.0.112-openj9@sha256:2a53348753a95914e52060d3d16c6e9e4f17ce62e5482a32b36d3d425b30afda
    container_name: omada
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
      - "8043:8043/tcp"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
    volumes:
      - omada_data:/opt/tplink/EAPController/data
    env_file:
      - /opt/secrets/omada/omada.env

volumes:
  omada_data:
