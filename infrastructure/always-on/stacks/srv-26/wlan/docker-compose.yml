version: '3.8'

services:
  omada-controller:
    image: mbentley/omada-controller:6.3.0.111-openj9@sha256:943e74aa657b97c0bace3a1431fc7fd733b9189cf2e8be60820d48d99ec583d6
    container_name: omada
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
      - "8043:8043/tcp"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
    volumes:
      - omada_data:/opt/tplink/EAPController/data
    env_file:
      - /opt/secrets/omada/omada.env

volumes:
  omada_data:
