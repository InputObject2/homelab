version: '3.8'

services:
  omada-controller:
    image: mbentley/omada-controller:6.3.0.45-openj9@sha256:b288af3dc78f287cb32eaf400195f16791098512f3d8777e38104179ed8a0c3c
    container_name: omada
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
      - "8043:8043/tcp"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
    volumes:
      - omada_data:/opt/tplink/EAPController/data
    env_file:
      - /opt/secrets/omada/omada.env

volumes:
  omada_data:
