version: '3.8'

services:
  omada-controller:
    image: mbentley/omada-controller:6.3.0.111-openj9@sha256:096e71630039b0f5e508576af9cce6559d5e2fe6b91c380c99dced93f91ca1bb
    container_name: omada
    restart: unless-stopped
    ports:
      - "8088:8088/tcp"
      - "8043:8043/tcp"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
    volumes:
      - omada_data:/opt/tplink/EAPController/data
    env_file:
      - /opt/secrets/omada/omada.env

volumes:
  omada_data:
