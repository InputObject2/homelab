version: '3.8'

services:
  github-runner:
    image: myoung34/github-runner:2.338.0@sha256:a97aa55628225bc94af2e78c40f6877a000430255af6bf0aed119a7b0b85ee8c
    container_name: github-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/home/runner
    env_file:
      - /opt/secrets/github-runner/github-runner.env

volumes:
  runner_data:
