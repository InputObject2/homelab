version: '3.8'

services:
  github-runner:
    image: myoung34/github-runner:2.338.1@sha256:c1531a71a722a30697f47866140daf942c2e8b724d21a48dcfcbeacb8f2e58a1
    container_name: github-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/home/runner
    env_file:
      - /opt/secrets/github-runner/github-runner.env

volumes:
  runner_data:
